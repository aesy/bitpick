[package]
name = "bitpick"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Fast terminal picker for Bitwarden credentials using rbw and fzf"
license = "MIT"
repository = "https://github.com/aesy/bitpick"
keywords = ["bitwarden", "rbw", "tui", "password-manager", "fzf"]
categories = ["command-line-utilities"]

[dependencies]
arboard = "3.7.0"
clap = { version = "4.6.9", features = ["derive", "env"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
which = "8.0.6"

[lints]
workspace = true
