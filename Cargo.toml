[package]
name = "bitwarden-tui"
version = "0.1.0"
edition = "2024"
description = "Fast terminal picker for Bitwarden credentials using bw and fzf"
license = "MIT"
repository = "https://github.com/iwertwein/bitwarden-tui"
keywords = ["bitwarden", "tui", "cli", "password-manager", "fzf"]
categories = ["command-line-utilities"]

[dependencies]
arboard = "3.6.1"
clap = { version = "4.6.1", features = ["derive", "env"] }
crossterm = "0.29.0"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
which = "8.0.2"
