[workspace]
resolver = "3"
members = ["app"]

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Duplicates come from optional transitive backends (termwiz, png) outside our control.
multiple_crate_versions = "allow"

[profile.release]
lto = true
strip = true
panic = "abort"
codegen-units = 1
