[workspace]
resolver = "3"
members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
authors = ["Isak Wertwein <isak.wertwein@gmail.com>"]
license = "MIT"
homepage = "https://aesy.github.io/bitpick/"
repository = "https://github.com/aesy/bitpick"

[workspace.dependencies]
arboard = "3.7.0"
clap = "4.6.9"
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
which = "8.0.6"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Duplicates come from optional transitive backends (termwiz, png) outside our control.
multiple_crate_versions = "allow"

[profile.release]
lto = true
strip = true
panic = "abort"
codegen-units = 1
